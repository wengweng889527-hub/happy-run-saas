<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步道乐跑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1e293b;border-radius:16px;padding:32px;width:100%;max-width:460px;box-shadow:0 25px 50px rgba(0,0,0,.4)}
h1{text-align:center;font-size:24px;margin-bottom:8px;color:#f1f5f9}
.subtitle{text-align:center;color:#94a3b8;font-size:14px;margin-bottom:28px}
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tab{flex:1;padding:10px;text-align:center;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s}
.tab.active{background:#10b981;border-color:#10b981;color:#fff}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
input{width:100%;padding:10px 14px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;transition:border .2s}
input:focus{border-color:#10b981}
.btn{width:100%;padding:12px;background:#10b981;border:none;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;transition:background .2s;margin-top:8px}
.btn:hover{background:#059669}
.error{color:#f87171;font-size:13px;margin-top:8px;text-align:center;display:none}
.success{color:#4ade80;font-size:13px;margin-top:8px;text-align:center;display:none}
.form-section{display:none}
.form-section.active{display:block}
.optional{font-size:11px;color:#64748b;margin-left:4px}
</style>
</head>
<body>
<div class="card">
  <h1>🏃 步道乐跑</h1>
  <p class="subtitle">步道乐跑 · 自动代跑 · 卡密激活</p>
  
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">登录</button>
    <button class="tab" onclick="switchTab('register')">卡密注册</button>
  </div>

  <div id="login-section" class="form-section active">
    <div class="form-group"><label>用户名</label><input id="login-user" type="text" placeholder="输入用户名"></div>
    <div class="form-group"><label>密码</label><input id="login-pass" type="password" placeholder="输入密码"></div>
    <button class="btn" onclick="doLogin()">登录</button>
    <p id="login-error" class="error"></p>
  </div>

  <div id="register-section" class="form-section">
    <div class="form-group"><label>卡密</label><input id="reg-key" type="text" placeholder="输入你的卡密"></div>
    <div class="form-group"><label>设置用户名</label><input id="reg-user" type="text" placeholder="至少3位"></div>
    <div class="form-group"><label>设置密码</label><input id="reg-pass" type="password" placeholder="至少6位"></div>
    <div class="form-group"><label>步道乐跑 APP 手机号/学号</label><input id="reg-phone" type="text" placeholder="你的步道乐跑登录账号"></div>
    <div class="form-group"><label>步道乐跑 APP 密码</label><input id="reg-app-pass" type="password" placeholder="你的步道乐跑登录密码"></div>
    <button class="btn" onclick="doRegister()">激活并注册</button>
    <p id="reg-error" class="error"></p>
    <p id="reg-ok" class="success"></p>
  </div>
</div>

<script>
const API = location.origin + '/api/auth';
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.form-section').forEach(x=>x.classList.remove('active'));
  if(t==='login'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('login-section').classList.add('active')}
  else{document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('register-section').classList.add('active')}
}

async function api(url, body) {
  const r = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  if(!r.ok) throw new Error(d.detail||'请求失败');
  return d;
}

async function doLogin() {
  const e = document.getElementById('login-error'); e.style.display='none';
  try {
    const d = await api(API+'/login', {username:document.getElementById('login-user').value, password:document.getElementById('login-pass').value});
    localStorage.setItem('token', d.token);
    localStorage.setItem('username', d.username);
    localStorage.setItem('is_admin', d.is_admin);
    location.href = d.is_admin ? '/admin' : '/dashboard';
  } catch(ex) { e.textContent=ex.message; e.style.display='block'; }
}

async function doRegister() {
  const e = document.getElementById('reg-error'), o = document.getElementById('reg-ok');
  e.style.display='none'; o.style.display='none';
  try {
    const d = await api(API+'/register', {
      card_key: document.getElementById('reg-key').value,
      username: document.getElementById('reg-user').value,
      password: document.getElementById('reg-pass').value,
      app_phone: document.getElementById('reg-phone').value,
      app_password: document.getElementById('reg-app-pass').value,
    });
    localStorage.setItem('token', d.token);
    localStorage.setItem('username', d.username);
    o.textContent='注册成功！跳转中...'; o.style.display='block';
    setTimeout(()=>location.href='/dashboard', 1000);
  } catch(ex) { e.textContent=ex.message; e.style.display='block'; }
}

document.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=document.querySelector('.tab.active');t.textContent.includes('登录')?doLogin():doRegister()}}));
</script>
</body>
</html>
